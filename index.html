<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windows Voice Assistant - Orb</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #02030a url('/background.jpg') center/cover no-repeat fixed;
      color: #dce6ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    /* Subtle overlay to enhance orb glow */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(4, 10, 24, 0.4) 0%, rgba(2, 3, 10, 0.85) 100%);
      pointer-events: none;
      z-index: 1;
    }
    main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    canvas {
      width: min(85vw, 560px);
      height: min(85vw, 560px);
      cursor: pointer;
      filter: drop-shadow(0 0 40px rgba(34, 106, 255, 0.35));
      transition: transform 0.2s ease;
    }
    canvas:hover {
      transform: scale(1.02);
    }
    /* Speak Bubble Floating Button */
    .bubble-btn {
      margin-top: 10px;
      background: rgba(15, 35, 75, 0.75);
      color: #e0edff;
      border: 1px solid rgba(80, 125, 255, 0.5);
      border-radius: 50px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 15px rgba(80, 125, 255, 0.2);
      transition: all 0.25s ease;
    }
    .bubble-btn:hover {
      background: rgba(23, 62, 149, 0.9);
      border-color: #507dff;
      box-shadow: 0 0 25px rgba(52, 120, 255, 0.6);
      transform: translateY(-2px);
    }
    .bubble-btn.active {
      background: rgba(0, 210, 255, 0.25);
      border-color: #00d2ff;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
    }
    .bubble-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    /* Floating Notification Badge */
    #status {
      margin-top: 14px;
      font-size: 14px;
      color: #9bb5dc;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(10, 20, 40, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 480px;
      text-align: center;
      transition: all 0.3s ease;
    }
    #status.success {
      color: #00f59b;
      border-color: rgba(0, 245, 155, 0.4);
      box-shadow: 0 0 15px rgba(0, 245, 155, 0.2);
    }
  </style>
</head>
<body>
  <main>
    <canvas id="orb" aria-label="Animated voice orb reacting to microphone"></canvas>
    <div>
      <button id="toggle" class="bubble-btn" title="Click to start/stop microphone">
        <svg class="bubble-icon" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <span id="btn-text">Start microphone</span>
      </button>
    </div>
    <p id="status" role="status">Click the speak bubble or orb to begin.</p>
  </main>

  <script>
    const c = document.querySelector('#orb');
    const g = c.getContext('2d');
    const button = document.querySelector('#toggle');
    const btnText = document.querySelector('#btn-text');
    const status = document.querySelector('#status');

    c.width = c.height = 700;
    let ctx, stream, analyser, data, level = 0, active = false;
    let recognition = null;

    // Toggle Microphone & Speech Recognition
    button.onclick = toggleMicrophone;
    c.onclick = toggleMicrophone;

    async function toggleMicrophone() {
      button.disabled = true;
      try {
        if (active) {
          stopListening();
        } else {
          await startListening();
        }
      } catch (e) {
        stopListening();
        status.textContent = e.message || 'Error accessing microphone.';
      } finally {
        button.disabled = false;
      }
    }

    async function startListening() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw Error('Open this page over http://localhost:5000 to enable microphone.');
      }
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();
      analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      ctx.createMediaStreamSource(stream).connect(analyser);
      data = new Uint8Array(analyser.fftSize);
      active = true;

      button.classList.add('active');
      btnText.textContent = 'Listening...';
      status.textContent = 'Listening — speak a command (e.g. "open youtube", "what time is it")';
      status.classList.remove('success');

      initWebSpeech();
    }

    function stopListening() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (ctx && ctx.state !== 'closed') ctx.close();
      if (recognition) {
        recognition.stop();
        recognition = null;
      }
      analyser = null;
      active = false;
      button.classList.remove('active');
      btnText.textContent = 'Start microphone';
      status.textContent = 'Microphone stopped. Click to resume.';
      status.classList.remove('success');
    }

    // Web Speech API for instant in-browser transcription
    function initWebSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        const last = event.results.length - 1;
        const phrase = event.results[last][0].transcript.trim();
        console.log("Heard phrase:", phrase);
        handleRecognizedCommand(phrase);
      };

      recognition.onerror = (e) => {
        console.warn("Speech error:", e.error);
      };

      recognition.onend = () => {
        if (active && recognition) {
          try { recognition.start(); } catch (_) {}
        }
      };

      try { recognition.start(); } catch (_) {}
    }

    // Send recognized command to local Python backend silently
    async function handleRecognizedCommand(command) {
      if (!command) return;

      let cmd = command.toLowerCase().trim();
      // Remove wake words if spoken
      cmd = cmd.replace(/^(hey windows|hello windows|ok windows|windows)\s*/i, '').trim() || cmd;

      status.textContent = `⚡ Executing: "${cmd}"`;
      status.classList.add('success');

      try {
        const res = await fetch(`/api/command?cmd=${encodeURIComponent(cmd)}`);
        const data = await res.json();
        console.log("Command response:", data);
      } catch (err) {
        console.error("API error:", err);
      }

      // Reset status pill after 3 seconds
      setTimeout(() => {
        if (active) {
          status.textContent = 'Listening — speak a command...';
          status.classList.remove('success');
        }
      }, 3000);
    }

    // Orb Animation Loop (User's Exact Canvas Algorithm)
    function draw(ms) {
      requestAnimationFrame(draw);
      let target = 0;
      if (active && analyser) {
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (let v of data) sum += ((v - 128) / 128) ** 2;
        target = Math.min(1, Math.sqrt(sum / data.length) * 5);
      }
      level += (target - level) * 0.16;
      let t = ms * 0.001;

      g.clearRect(0, 0, 700, 700);
      g.save();
      g.translate(350, 350);

      // Outer Glow Circle
      let r = 210 + level * 28;
      g.shadowColor = '#226aff';
      g.shadowBlur = 25 + level * 35;
      g.strokeStyle = '#3478ff';
      g.lineWidth = 2;
      g.beginPath();
      g.arc(0, 0, r, 0, Math.PI * 2);
      g.stroke();

      // Radial Gradient Halo
      let halo = g.createRadialGradient(0, 0, 10, 0, 0, r);
      halo.addColorStop(0, '#5225a055');
      halo.addColorStop(0.75, '#154dbb33');
      halo.addColorStop(1, '#05071800');
      g.fillStyle = halo;
      g.fill();

      // 6 Rotating Glowing Ribbon Loops with 3D Perspective
      g.globalCompositeOperation = 'screen';
      for (let j = 0; j < 6; j++) {
        let hue = 185 + j * 31;
        g.strokeStyle = `hsla(${hue}, 100%, 65%, 0.8)`;
        g.shadowColor = `hsl(${hue}, 100%, 60%)`;
        g.shadowBlur = 18 + level * 25;
        g.lineWidth = 5 + level * 8;
        g.beginPath();
        for (let i = 0; i <= 240; i++) {
          let a = i / 240 * Math.PI * 2;
          let radius = 105 + 25 * Math.sin(a * 3 + t * (0.65 + j * 0.08) + j) + level * 50 * Math.sin(a * 4 - t * 3 + j);
          let x = Math.cos(a) * radius;
          let y = Math.sin(a) * radius;
          let rot = t * 0.25 + j * 0.48;
          let xx = x * Math.cos(rot) - y * 0.7 * Math.sin(rot);
          let yy = x * Math.sin(rot) + y * 0.7 * Math.cos(rot);
          i ? g.lineTo(xx, yy) : g.moveTo(xx, yy);
        }
        g.closePath();
        g.stroke();
      }
      g.restore();
    }

    requestAnimationFrame(draw);
    window.addEventListener('pagehide', () => stream?.getTracks().forEach(t => t.stop()));
  </script>
</body>
</html>
